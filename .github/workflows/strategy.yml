name: strategy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
      - name: 合法手・裏返し・パス・終局・公式スコア
        run: uv run --directory strategy pytest tests/test_engine.py -q
      - name: カタログとランダム個体
        run: uv run --directory strategy pytest tests/test_agents.py -q
      - name: 盤の入力符号化
        run: uv run --directory strategy pytest tests/test_encode.py -q
      - name: WTHOR の 8×8 棋譜
        run: uv run --directory strategy pytest tests/test_wthor.py -q
      - name: 戦略 API の 1 局
        run: uv run --directory strategy pytest tests/test_api.py -q
      - name: OpenRouter の鍵と Jev 境界
        run: uv run --directory strategy pytest tests/test_openrouter.py -q
      - name: import lint
        run: uv run --directory strategy lint-imports
      - name: complexity
        run: uv run --directory strategy xenon --max-absolute C --max-modules B --max-average A src
