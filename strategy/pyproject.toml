[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy"
version = "0.1.0"
description = "対局と学習が共有する 8×8 リバーシ規則"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.15",
    "pytest>=8.3",
    "radon>=6.0.1",
    "ruff>=0.13",
    "xenon>=0.9.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reversi"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.radon]
exclude = "tests/*"

[tool.importlinter]
root_packages = ["reversi"]

[[tool.importlinter.contracts]]
name = "agents と train は engine の上、engine は board の上に rules と score を置く"
type = "layers"
layers = [
    "reversi.agents | reversi.train",
    "reversi.engine.score | reversi.engine.rules",
    "reversi.engine.board",
]

[[tool.importlinter.contracts]]
name = "engine は encode を読まない"
type = "forbidden"
source_modules = [
    "reversi.engine",
]
forbidden_modules = [
    "reversi.encode",
]

[[tool.importlinter.contracts]]
name = "Play-time layers"
type = "layers"
layers = [
    "reversi.api",
    "reversi.agents",
    "reversi.engine",
]

[[tool.importlinter.contracts]]
name = "Play-time must not import training"
type = "forbidden"
source_modules = [
    "reversi.api",
    "reversi.agents",
    "reversi.engine",
]
forbidden_modules = [
    "reversi.train",
]
