pre-commit:
  parallel: true
  commands:
    biome-format:
      glob: "*.{js,cjs,mjs,jsx,ts,cts,mts,tsx,json,jsonc,css}"
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true
    osv-scanner:
      # glob は相対パス全体に対して照合される。`**/` はディレクトリを1つ以上要求するため
      # ルート直下の package.json が漏れる。逆に `**/` 無しだけでは入れ子が漏れる。両方書く。
      glob:
        - "{uv.lock,pnpm-lock.yaml,package.json,package-lock.json,pyproject.toml}"
        - "**/{uv.lock,pnpm-lock.yaml,package.json,package-lock.json,pyproject.toml}"
      run: osv-scanner scan source -r .
    gitleaks:
      run: gitleaks git --pre-commit --staged --no-banner --redact -v
    import-linter:
      glob: "strategy/**/*.py"
      run: uv run --directory strategy lint-imports
    xenon:
      glob: "strategy/**/*.py"
      run: uv run --directory strategy xenon --max-absolute C --max-modules B --max-average A src
    dependency-cruiser:
      glob:
        - "web/**/*.{ts,tsx}"
        - ".dependency-cruiser.cjs"
      # web/ は初版の目標配置であり、未作成のあいだは設定変更だけで落とさない。
      run: test ! -d web || pnpm exec depcruise --config .dependency-cruiser.cjs web
