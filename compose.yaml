# Podman Compose。web と strategy を同一 Pod で起動する。
# 学習は train サービス。待ち受けせず `run` で一発起動する。
# profile は付けない（podman-compose 1.6.0 の `run` が profile 付きサービスを見ない）。
# 対局の up は web と strategy を明示し、train を載せない。
# 公開はホストのループバックだけ。secret の中身は書かない。

name: reversi-ai

x-podman:
  in_pod: true
  pod_args:
    - --infra=false
    - --share=

services:
  web:
    build:
      context: .
      dockerfile: web/Containerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/certs:/app/data/certs:ro
    environment:
      STRATEGY_BASE_URL: http://127.0.0.1:8000

  strategy:
    build:
      context: .
      dockerfile: strategy/Containerfile
      target: strategy
    network_mode: service:web
    depends_on:
      - web
    volumes:
      - ./data:/data
      - ./models:/models
      - ./prompts:/prompts:ro
    secrets:
      - source: openrouter-api-key-reversi
        target: /run/secrets/openrouter-api-key

  train:
    build:
      context: .
      dockerfile: strategy/Containerfile
      target: train
    # イメージに uv sync --frozen --no-dev --group train を焼く。実行時には sync しない。
    # 対局の up は web と strategy だけを対象にする。誤って train を up しても常時起動しない。
    # 学習の入口は `run` が command を上書きする。
    volumes:
      - ./data:/data
      - ./models:/models
    restart: "no"
    command: ["python", "-c", "pass"]

secrets:
  openrouter-api-key-reversi:
    external: true
