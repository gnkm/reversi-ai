[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy"
version = "0.1.0"
description = "対局と学習が共有する 8×8 リバーシ規則"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.1",
    "pytest>=8.3",
    "xenon>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reversi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_packages = ["reversi"]

[[tool.importlinter.contracts]]
name = "api は agents と train の上、engine は board の上に rules と score を置く"
type = "layers"
layers = [
    "reversi.api",
    "reversi.agents | reversi.train",
    "reversi.engine.score | reversi.engine.rules",
    "reversi.engine.board",
]

[[tool.importlinter.contracts]]
name = "engine は encode を読まない"
type = "forbidden"
source_modules = [
    "reversi.engine",
]
forbidden_modules = [
    "reversi.encode",
]

[[tool.importlinter.contracts]]
name = "api は train を読まない"
type = "forbidden"
source_modules = [
    "reversi.api",
]
forbidden_modules = [
    "reversi.train",
]
