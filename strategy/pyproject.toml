[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy"
version = "0.1.0"
description = "対局と学習が共有する 8×8 リバーシ規則"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8.3",
    "xenon>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reversi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_packages = ["reversi"]

[[tool.importlinter.contracts]]
name = "agents は engine の上に置き、engine は board の上に rules と score を置く"
type = "layers"
layers = [
    "reversi.agents",
    "reversi.engine.score | reversi.engine.rules",
    "reversi.engine.board",
]
